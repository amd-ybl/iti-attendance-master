name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Electron Builder
        run: npm install --save-dev electron electron-builder

      - name: Build Web App
        run: npm run build

      - name: Create Electron Main File
        run: |
          Set-Content -Path "electron-main.cjs" -Value @"
          const { app, BrowserWindow, Menu } = require('electron');
          const path = require('path');
          function createWindow() {
            const mainWindow = new BrowserWindow({
              width: 1366,
              height: 850,
              minWidth: 1024,
              minHeight: 650,
              title: 'ITI Attendance Master',
              autoHideMenuBar: true,
              webPreferences: { nodeIntegration: false, contextIsolation: true }
            });
            Menu.setApplicationMenu(null);
            mainWindow.loadFile(path.join(__dirname, 'dist', 'index.html'));
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          "@

      - name: Build Windows .EXE Installer
        run: npx electron-builder --win --x64 -c.extraMetadata.main="electron-main.cjs" -c.productName="ITI-Attendance-Master" -c.appId="com.itibilha.attendancemaster" -c.win.target="nsis" -c.directories.output="release"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ITI-Attendance-Master-Windows-EXE
          path: release/*.exe
